</style></head><body><main><header><div><strong>GAGA <em>3D</em></strong> <small>V0.4</small><div><small>RHINO 8 · GRASSHOPPER · IPHONE</small></div></div><small id="status">● DÉMO</small></header><nav><button id="demo" class="on">Démo</button><button id="import">＋ Import GLB</button><button id="fit">⌖ Cadrer</button></nav><input id="file" type="file" accept=".glb,model/gltf-binary"><div class="viewport" id="viewport"><div class="floating label" id="modelName">MARCHÉ YASSAMINE — DÉMO</div><div class="floating tools"><button id="layers">☷</button><button id="section">◫</button><button id="reset">↺</button></div><div class="floating views"><span></span><button data-view="top">TOP</button><span></span><button data-view="left">LEFT</button><button data-view="iso" class="on">3D</button><button data-view="right">RIGHT</button><span></span><button data-view="front">FACE</button></div><div class="floating hint">1 doigt : orbite · 2 doigts : zoom/pan</div><div class="panel" id="layerPanel" hidden><div class="heading">VISIBILITÉ · GROUPES / OBJETS<button class="close" data-close="layerPanel">✕</button></div><div id="layerList"></div></div><div class="panel" id="sectionPanel" hidden><div class="heading">COUPE HORIZONTALE<button class="close" data-close="sectionPanel">✕</button></div><label class="layer">Coupe active<input type="checkbox" id="clipEnabled"></label><input type="range" id="clipRange" min="0" max="100" value="60"><small id="clipLabel">60 %</small></div><div class="info" id="info" hidden><div class="heading"><span id="itemName">Objet</span><button class="close" id="closeInfo">✕</button></div><p class="meta" id="itemData"></p><nav><button id="isolate">Isoler</button><button id="showAll">Tout afficher</button></nav></div></div><footer><span id="counts">175 éléments de démo</span><span id="cameraLabel">Perspective</span></footer><div id="notice">Modèle fictif — aucun plan ni surface de projet réel. Import GLB local.</div></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const $=x=>document.getElementById(x),scene=new T.Scene();scene.background=new T.Color('#14293b');const camera=new T.PerspectiveCamera(45,1,.01,1e6),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.localClippingEnabled=true;$('viewport').prepend(renderer.domElement);const ctl=new OrbitControls(camera,renderer.domElement);ctl.enableDamping=true;ctl.screenSpacePanning=true;scene.add(new T.HemisphereLight(0xe7f3ff,0x355166,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(20,35,15);scene.add(light);let model=null,selected=null,original=null,parts=[],bbox=new T.Box3(),center=new T.Vector3(),size=new T.Vector3();const plane=new T.Plane(new T.Vector3(0,-1,0),0);
function box(w,h,d,color,x,y,z,name){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color,roughness:.8}));m.position.set(x,y,z);m.name=name;return m}
function makeDemo(){const root=new T.Group();root.name='Marché Yassamine — démo';const stalls=new T.Group();stalls.name='Commerces';const pal=[0xdba989,0xc7d0ad,0xc4b4d7,0x9ebed0,0xe2c8a6,0xb7d1c4,0xd8b4b6];for(let i=0;i<175;i++){const r=Math.floor(i/25),c=i%25;const m=box(1.46,1.7,2.05,pal[r],(c-12)*1.78,.85,(r-3)*3.55,'Commerce C-'+String(i+1).padStart(3,'0'));m.userData={pole:String.fromCharCode(65+r),notice:'dimensions fictives'};stalls.add(m)}root.add(stalls);const terrain=new T.Group();terrain.name='Terrain';terrain.add(box(50,.1,33,0x526e7c,0,-.17,0,'Sol'));root.add(terrain);const path=new T.Group();path.name='Circulations';path.add(box(48,.03,2.1,0xd8c38d,0,-.06,0,'Allée démo'));root.add(path);const roof=new T.Group();roof.name='Couverture';roof.add(box(48,.12,30,0x79adbf,0,6,0,'Toiture'));roof.children[0].material.transparent=true;roof.children[0].material.opacity=.20;roof.children[0].material.depthWrite=false;for(const x of [-23,-11,1,13,23])for(const z of [-14,14])roof.add(box(.35,5.6,.35,0x729ab1,x,2.8,z,'Poteau'));root.add(roof);return root}
function clearSelect(){if(selected){(Array.isArray(selected.material)?selected.material:[selected.material]).forEach(m=>{if(m!==original&&!Array.isArray(original))m.dispose()});selected.material=original;selected=null;original=null}$('info').hidden=true}
function measure(){bbox.setFromObject(model);bbox.getCenter(center);bbox.getSize(size);return Math.max(size.length(),.1)}
function fit(){if(!model)return;const d=measure();camera.near=Math.max(.001,d/10000);camera.far=d*500;camera.updateProjectionMatrix();camera.position.copy(center).add(new T.Vector3(d*.8,d*.65,d*.9));ctl.target.copy(center);ctl.minDistance=d*.003;ctl.maxDistance=d*120;ctl.update()}
function clip(){if(!model)return;measure();plane.constant=bbox.min.y+size.y*(+$('clipRange').value/100);$('clipLabel').textContent=$('clipRange').value+' %';model.traverse(o=>{if(o.isMesh){for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.clippingPlanes=$('clipEnabled').checked?[plane]:[];m.needsUpdate=true}}})}
function setDescendants(obj,v){obj.traverse(o=>o.visible=v)}
function allVisible(){model.traverse(o=>o.visible=true);clearSelect();layers()}
function layers(){
 const l=$('layerList');l.replaceChildren();if(!model)return;
 const buttons=document.createElement('div');buttons.style.cssText='display:flex;gap:6px;margin-bottom:9px';
 for(const [label,val] of [['Tout voir',true],['Tout cacher',false]]){
  const b=document.createElement('button');b.textContent=label;b.style.cssText='font-size:11px;padding:6px;flex:1;min-height:30px';
  b.onclick=()=>{model.traverse(o=>o.visible=val);clearSelect();layers()};buttons.append(b)
 }l.append(buttons);
 const search=document.createElement('input');search.type='search';search.placeholder='Rechercher un objet…';search.style.cssText='width:100%;padding:9px;background:#0a1d2d;color:white;border:1px solid #41647a;border-radius:8px;margin-bottom:8px';l.append(search);
 const tree=document.createElement('div');l.append(tree);
 const add=(obj,level)=>{
  if(level>8)return;
  const row=document.createElement('div');row.className='layer';row.style.paddingLeft=Math.min(level,5)*10+'px';
  const left=document.createElement('span');left.style.cssText='display:flex;align-items:center;gap:5px;min-width:0;flex:1';
  const children=obj.children.filter(o=>o.isMesh||o.isGroup);
  const exp=document.createElement('button');exp.textContent=children.length?'▸':'·';exp.style.cssText='min-width:23px;min-height:26px;padding:0;background:transparent;border:0';left.append(exp);
  const label=document.createElement('span');label.textContent=obj.name|| (obj.isMesh?'Maillage':'Groupe');label.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap';left.append(label);
  const check=document.createElement('input');check.type='checkbox';check.checked=obj.visible;check.title='Afficher ou masquer';check.onchange=()=>{setDescendants(obj,check.checked);clearSelect();layers()};
  row.append(left,check);tree.append(row);
  const childbox=document.createElement('div');tree.append(childbox);childbox.hidden=true;

 };
 const addInto=(obj,level,target)=>{
  const wrap=document.createElement('div');target.append(wrap);
  const row=document.createElement('div');row.className='layer';row.style.paddingLeft=Math.min(level,5)*10+'px';
  const children=obj.children.filter(o=>o.isMesh||o.isGroup);
  const toggle=document.createElement('button');toggle.textContent=children.length?'▸':'·';toggle.style.cssText='min-width:22px;min-height:26px;padding:0;border:0;background:transparent';
  const name=document.createElement('span');name.textContent=obj.name|| (obj.isMesh?'Maillage':'Groupe');name.style.cssText='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  const c=document.createElement('input');c.type='checkbox';c.checked=obj.visible;c.onchange=()=>{setDescendants(obj,c.checked);clearSelect();layers()};
  row.append(toggle,name,c);wrap.append(row);
  if(children.length&&level<8){const inside=document.createElement('div');inside.hidden=true;wrap.append(inside);let populated=false;toggle.onclick=()=>{if(!populated){for(const ch of children)addInto(ch,level+1,inside);populated=true}inside.hidden=!inside.hidden;toggle.textContent=inside.hidden?'▸':'▾'}}
 };
 for(const obj of model.children.filter(o=>o.isMesh||o.isGroup))addInto(obj,0,tree);
 search.oninput=()=>{
  tree.replaceChildren();const q=search.value.trim().toLowerCase();
  if(!q){for(const o of model.children.filter(o=>o.isMesh||o.isGroup))addInto(o,0,tree);return}
  model.traverse(o=>{if((o.isMesh||o.isGroup)&&o!==model&&(o.name||'').toLowerCase().includes(q))addInto(o,0,tree)})
 };
}function load(next,isDemo,name){clearSelect();if(model)scene.remove(model);model=next;scene.add(model);$('modelName').textContent=name;$('status').textContent=isDemo?'● DÉMO':'● GLB CHARGÉ';$('demo').classList.toggle('on',isDemo);let count=0;model.traverse(o=>{if(o.isMesh)count++});$('counts').textContent=count+' maillages';$('notice').textContent=isDemo?'Démo fictive : aucune donnée architecturale validée.':'GLB chargé localement : géométrie et métadonnées disponibles dans le fichier.';fit();layers();clip()}
function view(v){const d=measure()*1.6;const p=v==='top'?[.001,d,.001]:v==='front'?[0,0,d]:v==='left'?[-d,.001,0]:v==='right'?[d,.001,0]:[d*.75,d*.7,d*.8];camera.position.copy(center).add(new T.Vector3(...p));ctl.target.copy(center);ctl.update();$('cameraLabel').textContent=({top:'Dessus',front:'Face',left:'Gauche',right:'Droite',iso:'Perspective'})[v];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v))}
function pick(x,y){const r=renderer.domElement.getBoundingClientRect(),p=new T.Vector2((x-r.left)/r.width*2-1,-((y-r.top)/r.height*2-1)),ray=new T.Raycaster();ray.setFromCamera(p,camera);const hits=ray.intersectObject(model,true).filter(h=>h.object.visible&&h.object.parent?.visible&&(!$('clipEnabled').checked||h.point.y<=plane.constant));clearSelect();if(!hits.length)return;selected=hits[0].object;original=selected.material;selected.material=Array.isArray(original)?original.map(m=>m.clone()):original.clone();for(const m of (Array.isArray(selected.material)?selected.material:[selected.material]))m.color?.set('#4fe2ee');$('itemName').textContent=selected.name||'Maillage';const data=Object.entries(selected.userData||{}).filter(([k,v])=>typeof v==='string'||typeof v==='number').slice(0,8);$('itemData').textContent=data.length?data.map(([k,v])=>k+': '+v).join(' · '):'Aucune propriété BIM embarquée';$('info').hidden=false}
$('demo').onclick=()=>load(makeDemo(),true,'MARCHÉ YASSAMINE — DÉMO');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!/\.glb$/i.test(f.name)){$('notice').textContent='Format .glb uniquement : exporter depuis Rhino.';return}if(f.size>150e6){$('notice').textContent='Fichier volumineux : optimiser le GLB pour iPhone.';return}$('status').textContent='Chargement…';try{new GLTFLoader().parse(await f.arrayBuffer(),'',g=>load(g.scene,false,f.name),err=>{$('status').textContent='Erreur';$('notice').textContent=err.message})}catch(err){$('status').textContent='Erreur';$('notice').textContent=err.message}e.target.value=''};$('fit').onclick=fit;$('reset').onclick=()=>{allVisible();fit();view('iso')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('layers').onclick=()=>{$('layerPanel').hidden=!$('layerPanel').hidden;$('sectionPanel').hidden=true};$('section').onclick=()=>{$('sectionPanel').hidden=!$('sectionPanel').hidden;$('layerPanel').hidden=true};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$((b.dataset.close)).hidden=true);$('clipEnabled').onchange=clip;$('clipRange').oninput=clip;$('closeInfo').onclick=clearSelect;$('isolate').onclick=()=>{if(!selected)return;for(const obj of parts)obj.visible=obj===selected||obj===selected.parent||!!obj.getObjectById(selected.id);layers()};$('showAll').onclick=()=>{allVisible()};let down=null,moved=false;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};moved=false});renderer.domElement.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)moved=true});renderer.domElement.addEventListener('pointerup',e=>{if(down&&!moved)pick(e.clientX,e.clientY);down=null});new ResizeObserver(()=>{const w=$('viewport').clientWidth,h=$('viewport').clientHeight;if(w&&h){camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}}).observe($('viewport'));load(makeDemo(),true,'MARCHÉ YASSAMINE — DÉMO');(function render(){requestAnimationFrame(render);ctl.update();renderer.render(scene,camera)})();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
